# --- MINIMAL DEBUG CONFIGURATION ---

# Theme and Plugins
theme: minimal-mistakes-jekyll
minimal_mistakes_skin: "dark"
plugins:
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-paginate-v2

# Site Title and Description
title: "Miguel Faria - Portfolio"
title_separator: "|"
name: "Miguel Faria"
description: "A showcase of my work in game development, rendering with DirectX 12, and computer science."
url: "https://mmigas.github.io" # Your full website URL
baseurl: "" # Leave this blank for a user site like yours
repository: "mmigas/mmigas.github.io" # Your repo name, helps the theme with links

#-----------------------------------------------
# AUTHOR SIDEBAR (VERY IMPORTANT FOR PORTFOLIOS)
#-----------------------------------------------

author:
  name: "Miguel Faria"
  image: "/assets/images/photo.jpg" # IMPORTANT: Create this folder and add your photo!
  bio: "Game Engine Developer & Graphics Programmer."
  location: "Lisbon, Portugal"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/mmigas"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/miguel-faria-4a3005200/" # Add your LinkedIn URL
    - label: "X"
      icon: "fab fa-fw fa-x"
      url: "https://x.com/mmigas100" # Add your Twitter URL if you have one
    - label: "Instagram"
      icon: "fab fa-fw fa-instagram"
      url: "https://www.instagram.com/mmigas100/" # Add your Instagram URL if you have one
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:miguel.al.faria@gmail.com"
    # Add other links like Twitter if you have them

#-----------------------------------------------
# DEFAULTS
#-----------------------------------------------

# These settings are applied to all pages and posts by default.
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false # Shows the author sidebar on blog posts
      share: false
  # _projects
  - scope:
      path: ""
      type: projects
    values:
      layout: single
      author_profile: true # Shows the author sidebar on your project pages
      share: false
      show_pagination: false
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true # Shows the author sidebar on pages like Home/About

# Collections Setup
collections:
  projects:
    output: true
    permalink: /projects/:name/

# Pagination Setup - FORCED ON
pagination:
  enabled: true
  collection: 'projects'
  per_page: 5
  sort_field: 'date'
  sort_reverse: true

sass:
  sass_dir: _sass
  style: compressed
  quiet_deps: true # This is the magic line